[project]
name = "alkaly"
version = "0.0.1"
description = "alkaly - alkali atoms in magnetic fields (in development)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Rodolphe Momier", email = "momier.rodolphe@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lmfit>=1.3",
    "matplotlib>=3.8",
    "numpy>=2",
    "scipy>=1.13",
]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Repository = "https://github.com/momierr/alkaly"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "D", "PT", "C4","PL"]
ignore = ["E741", "PLR2004", "PLR0913", "D105", "D107"]  # physics symbols, magic numbers, many args
[tool.ruff.lint.pydocstyle]
convention = "numpy"
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR"]

[tool.pytest.ini_options]
addopts = "--strict-markers -ra --cov=alkaly --cov-report=term-missing"
markers = ["slow: long tests", "oracle: compares to golden data", "network: needs internet"]

[tool.mypy]
strict = true
files = ["src"]
